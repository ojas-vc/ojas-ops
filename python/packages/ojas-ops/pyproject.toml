[project]
name = "ojas-ops"
version = "0.1.0"
description = "Open Operations Research & Optimization Framework"
readme = "README.md"
requires-python = ">=3.12, <3.15"
authors = [
    { name = "Balu Varanasi", email = "balu@chitram.ai" },
]
dependencies = [
    "ortools>=9.15.6755",
    "msgspec>=0.22.0",
]

[project.optional-dependencies]
django = [
    "django>=5.2",
    "django-bolt>=0.13.0",
]
temporal = [
    "temporalio>=1.8.0",
]
agents = [
    "anthropic>=0.40.0",
    "langchain-core>=0.3.0",
]
all = [
    "ojas-ops[django,temporal,agents]",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
    "mypy>=1.10.0",
    "django>=5.2",
    "django-bolt>=0.13.0",
    "temporalio>=1.8.0",
    "anthropic>=0.40.0",
    "langchain-core>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
