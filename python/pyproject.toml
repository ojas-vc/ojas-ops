[project]
name = "ojas-ops-workspace"
version = "0.1.0"
description = "Ojas Ops workspace — Open Operations Research & Optimization Framework"
readme = "README.md"
requires-python = ">=3.12, <3.15"
authors = [
    { name = "Balu Varanasi", email = "balu@chitram.ai" },
]
dependencies = [
    "anthropic>=0.40.0",
    "django>=5.2",
    "django-bolt>=0.13.0",
    "langchain-core>=0.3.0",
    "ojas-ops",
    "temporalio>=1.8.0",
]

[project.optional-dependencies]
dev = [
    "anthropic>=0.40.0",
    "langchain-core>=0.3.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[tool.uv.workspace]
members = ["apps/*", "packages/*"]

[tool.uv.sources]
ojas-ops = { workspace = true }
ojas-ops-sandbox = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
warn_unused_configs = true

