site_name: Ojas Ops
site_description: Open Operations Research & Optimization Framework
site_author: CHITRAM.AI PRIVATE LIMITED
site_url: https://ojas.vc

repo_name: ojas-vc/ojas-ops
repo_url: https://github.com/ojas-vc/ojas-ops

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Architecture: architecture.md
  - API Reference: api.md
  - Domain Models: models.md
  - Calendar Providers: calendars.md
  - Constraints Engine: constraints.md
  - Objectives: objectives.md
  - Solvers: solvers.md
  - Validation Engine: validation.md
  - Simulation & Rescheduling: simulation.md
  - Domain Adapters: adapters.md

